name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译 dylib
        run: |
          set -x
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          clang --version
          SRC="$GITHUB_WORKSPACE/XHSNotifyTweak-src"
          if [ ! -d "$SRC" ]; then
            SRC=$(dirname "$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name Makefile | head -1)")
          fi
          cd "$SRC"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib -fobjc-arc -O2 \
            -isysroot "$SDK" \
            -miphoneos-version-min=12.0 \
            -framework UIKit -framework Foundation -framework AVFoundation \
            -framework AudioToolbox -framework UserNotifications \
            -framework QuartzCore -framework CoreGraphics \
            -install_name @rpath/XHSNotifyTweak.dylib \
            Hooks.m NYConfig.m NYNotifier.m NYSettings.m \
            -o XHSNotifyTweak.dylib
          ls -l XHSNotifyTweak.dylib

      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: XHSNotifyTweak-dylib
          path: "**/*.dylib"
          if-no-files-found: error
